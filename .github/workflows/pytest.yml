name: Shopping Agent Regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Gate and agent regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Four-configuration synthetic demo
        run: python -m demo.run_demo --output-dir results/ci-demo
